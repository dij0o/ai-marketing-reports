<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Example Property Site | Marketing report sample</title><style id="css">
:root{--bg:#F2F4F3;--surface:#FFFFFF;--ink:#14232B;--muted:#5B6B73;--line:#D9DFE1;--teal:#0E7A6B;--teal-soft:#D5ECE7;--secondary:#8D9BA2;--gold:#B8871F;--gold-soft:#F5E9CC;--risk:#B8442C;--risk-soft:#F6DDD6;--warn:#A06C0C;--warn-soft:#F6EACB;color-scheme:light}

:root[data-theme="dark"]{--bg:#0E171B;--surface:#15222A;--ink:#E6EDEF;--muted:#93A3AA;--line:#26353C;--teal:#3BB39F;--teal-soft:#173A35;--secondary:#6E7F87;--gold:#E0B552;--gold-soft:#3A3120;--risk:#E2735B;--risk-soft:#3D2420;--warn:#D9A53A;--warn-soft:#3A3020;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
h1,h2,h3,p{margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.brand span{font-weight:500;color:var(--muted)}
.wk{color:var(--muted);font-size:.95rem}
.banner{margin-top:20px;padding:12px 16px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.93rem;border-left:4px solid var(--warn)}
.answer{padding:40px 0 8px;max-width:30ch}
.answer h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.03em;font-weight:700}
.answer h1 b{font-weight:800}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.95rem}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.s-on{background:var(--teal-soft);color:var(--teal)}.s-risk{background:var(--warn-soft);color:var(--warn)}.s-behind{background:var(--risk-soft);color:var(--risk)}
.sub{margin-top:16px;color:var(--muted);max-width:62ch}
.sub strong{color:var(--ink);font-weight:600}
section{margin-top:44px}
h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.h2note{color:var(--muted);font-size:.93rem;margin-top:4px;max-width:66ch}
.chart{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 4px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);padding:4px 12px 10px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;margin-top:44px}
.grid2 section{margin-top:0}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.chain{list-style:none;margin:16px 0 0;padding:0;position:relative}
.chain li{position:relative;padding:14px 0 14px 28px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:baseline}
.chain li::before{content:"";position:absolute;left:6px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--teal)}
.chain li:first-child::before{background:var(--teal)}
.chain::before{content:"";position:absolute;left:10px;top:24px;bottom:24px;width:1px;background:var(--line)}
.chain .nm{font-weight:600}
.chain .ex{grid-column:1;color:var(--muted);font-size:.86rem}
.chain .val{grid-row:1/3;grid-column:2;text-align:right;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.chain .val small{display:block;font-size:.8rem;font-weight:500}
.up{color:var(--teal)}.down{color:var(--risk)}.flat{color:var(--muted)}
.conv{display:flex;align-items:stretch;gap:0;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.conv div{flex:1;padding:16px}
.conv div+div{border-left:1px solid var(--line)}
.conv b{display:block;font-size:1.5rem;letter-spacing:-.02em}
.conv span{color:var(--muted);font-size:.85rem}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:16px}
@media (max-width:820px){.notes{grid-template-columns:1fr}}
.notes div{border-top:3px solid var(--line);padding-top:12px}
.notes .n-risk{border-color:var(--risk)}.notes .n-dec{border-color:var(--gold)}.notes .n-move{border-color:var(--teal)}
.notes h3{font-size:1rem;font-weight:700;margin-bottom:6px}
.notes p{white-space:pre-wrap;color:var(--ink);font-size:.95rem}
.notes p.empty{color:var(--muted)}
details.edit{margin-top:56px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.edit summary{cursor:pointer;padding:16px 20px;font-weight:700}
.editbody{padding:0 20px 20px}
.tblwrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:.88rem;min-width:860px;width:100%}
th{text-align:left;font-weight:600;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:4px 6px;border-bottom:1px solid var(--line)}
td.cur{font-weight:700}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%}
input[type=number]{max-width:110px}
textarea{min-height:90px;resize:vertical}
.rates{display:flex;gap:20px;flex-wrap:wrap;margin:16px 0}
.rates label,.ntext label{display:block;font-size:.86rem;color:var(--muted);margin-bottom:4px}
.ntext{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
@media (max-width:820px){.ntext{grid-template-columns:1fr}}
.actions{display:flex;gap:14px;align-items:center;margin-top:18px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;background:var(--teal);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:.9rem;color:var(--muted)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.foot{margin-top:40px;color:var(--muted);font-size:.85rem}main{max-width:none;padding:32px clamp(20px,3vw,48px) 64px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:1.7rem;letter-spacing:-.02em;line-height:1.15}
.stat span{color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{font-size:1rem;font-weight:700}
.card .cnote{color:var(--muted);font-size:.86rem;margin:2px 0 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;margin-top:16px}
@media (max-width:480px){.cols{grid-template-columns:1fr}}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-top:6px;gap:2px}
.stack i{display:block;height:100%}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 18px;margin-top:12px;font-size:.88rem}
.keys span{display:flex;align-items:center;gap:8px}
.keys em{font-style:normal;color:var(--muted);margin-left:auto;white-space:nowrap}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.brow{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:.9rem}
.brow .lb small{color:var(--muted);margin-left:6px}
.brow .tr{background:var(--bg);border-radius:5px;height:16px;overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:5px}
.brow .vl{font-weight:600;min-width:3.2em;text-align:right}
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px;margin-top:16px}
@media (max-width:520px){.risks{grid-template-columns:1fr}}
.rk{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:14px;padding:16px 18px}
.rk.high{border-top-color:var(--risk)}.rk.med{border-top-color:var(--warn)}.rk.watch{border-top-color:var(--teal)}
.chip{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
.high .chip{background:var(--risk-soft);color:var(--risk)}.med .chip{background:var(--warn-soft);color:var(--warn)}.watch .chip{background:var(--teal-soft);color:var(--teal)}
.rk h3{font-size:1.05rem;margin:8px 0 2px}
.rk .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.rk .big b{font-size:2rem;letter-spacing:-.02em;line-height:1.1}
.rk .big span{color:var(--muted);font-size:.88rem}
.rk p{font-size:.9rem;margin-top:12px}
.cols-viz{display:flex;align-items:flex-end;gap:8px;height:96px;padding-top:6px}
.cv{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cv .stk{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px;background:var(--line)}
.cv .stk i{display:block;width:100%}
.cv small{font-size:.72rem;color:var(--muted);margin-top:4px;white-space:nowrap}
.cv em{font-style:normal;font-size:.75rem;font-weight:600;margin-bottom:2px}
.leg2{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.leg2 span{display:flex;align-items:center;gap:6px}
.ctrrow{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;font-size:.82rem;padding:2px 0}
.ctrrow .tr{position:relative;background:var(--bg);height:14px;border-radius:4px}
.ctrrow .tr i{display:block;height:100%;background:var(--risk);border-radius:4px}
.ctrrow .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold);text-decoration:none}
.flow{display:grid;grid-template-columns:1fr 24px minmax(0,1.1fr);gap:6px 10px;align-items:center;font-size:.88rem;padding:4px 0}
.flow .pth{word-break:break-all}
.flow .ar{color:var(--muted);text-align:center}
.flow .ct{font-weight:700}
.pth2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.pth2:last-child{border-bottom:0}
.pth2 b{white-space:nowrap}
.insights{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}

.t2{width:100%;min-width:0;border-collapse:collapse;font-size:.88rem}
.t2 th{font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}

.t2 td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}

.fsum{flex-basis:100%;color:var(--muted);font-size:.85rem}

.fdet{flex-basis:100%}
.fdet summary{cursor:pointer;font-size:.88rem;font-weight:600;color:var(--teal)}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin-top:10px;font-size:.88rem}

.clist em{font-style:normal;color:var(--muted);margin-left:auto}
.botl{margin:10px 0 0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.fresh{margin-top:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.fitem{display:grid;grid-template-columns:12px 1fr;gap:8px;font-size:.84rem;align-items:start}

.fitem span{color:var(--muted);display:block}

.ftoday{margin-top:10px;font-size:.88rem;border-top:1px solid var(--line);padding-top:8px}
.fbad{margin-top:10px;padding:8px 12px;background:var(--risk-soft);color:var(--risk);border-radius:8px;font-size:.88rem;font-weight:600}
.notes ul{margin:0;padding-left:18px;font-size:.95rem}
.notes li{margin:0 0 6px}
.notes.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:820px){.notes.two{grid-template-columns:1fr}}


@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.cols{grid-template-columns:1fr}.card{min-width:0}.tw{overflow-x:auto}.brand span{display:block}.brow{grid-template-columns:minmax(100px,1fr) minmax(70px,1.5fr) minmax(45px,auto)}.pth{overflow-wrap:anywhere}}

.answer{max-width:900px}.answer h1{max-width:28ch}.brand span{margin-left:.3em}
